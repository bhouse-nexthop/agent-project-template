# Size caps for the files agents read on every resume or heartbeat, in KB (1 KB = 1024 bytes).
# Format: <glob relative to the repo root> <cap_kb>. archive/ and _TEMPLATE/_template files are never checked.
# Over cap fails the pre-commit hook: move settled text to archive/ and leave a pointer (RULES rule 22).
CLAUDE.md 2
README.md 8
RULES.md 10
WORKLIST.md 8
CANDIDATES.md 8
REVIEW.md 12
areas/*/STATUS.md 8
plan/*.md 8

# Queue rules for WORKLIST.md (RULES rule 23).
queue_item_max_lines 3
queue_item_max_chars 600
log_max_lines 40

# Days after which a "Last verified: YYYY-MM-DD" line is reported stale (a warning, not a failure).
stale_days 3
